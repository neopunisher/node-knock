name: Publish to npm

# Stages a release to npm via Trusted Publishing (OIDC) — no npm token is
# stored in this repository. npm is configured to trust this repo + workflow
# (package Settings -> Trusted Publisher -> GitHub Actions, "publish.yml"),
# and the grant is stage-only: after this workflow runs, approve the staged
# version (2FA) on npmjs.com under the package's "Staged Packages" tab, or
# with `npm stage approve`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token npm exchanges for publish access
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Pinned: needs `npm stage` (>= 11.15); npm 12.1.0 mangles this
      # package's bin entry at pack time.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      # prepublishOnly runs typecheck + tests + build before the stage
      - run: npm stage publish
